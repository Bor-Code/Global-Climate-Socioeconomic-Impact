version: "3.9"

x-common-env: &common-env
  env_file: ../.env
  environment:
    - DAGSTER_HOME=/dagster_home
    - DUCKDB_PATH=/data/climate_wellbeing.duckdb

services:

  dagster-webserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: climate_dagster_webserver
    <<: *common-env
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /app/orchestration/workspace.yaml
    ports:
      - "3000:3000"
    volumes:
      - dagster_home:/dagster_home
      - ../data:/data
      - ../dbt_project:/app/dbt_project
    depends_on:
      - dagster-daemon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dagster-daemon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: climate_dagster_daemon
    <<: *common-env
    command: dagster-daemon run -w /app/orchestration/workspace.yaml
    volumes:
      - dagster_home:/dagster_home
      - ../data:/data
      - ../dbt_project:/app/dbt_project
    restart: unless-stopped

  fastapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: climate_fastapi
    <<: *common-env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  react-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: climate_react
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - fastapi

  prometheus:
    image: prom/prometheus:latest
    container_name: climate_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - fastapi

  grafana:
    image: grafana/grafana:latest
    container_name: climate_grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  dagster_home:
    driver: local
