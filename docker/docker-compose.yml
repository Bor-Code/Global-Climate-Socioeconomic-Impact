version: "3.9"

x-common-env: &common-env
  env_file: ../.env
  environment:
    - DAGSTER_HOME=/dagster_home
    - DUCKDB_PATH=/data/climate_wellbeing.duckdb

services:

  dagster-webserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: climate_dagster_webserver
    <<: *common-env
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /app/orchestration/workspace.yaml
    ports:
      - "3000:3000"
    volumes:
      - dagster_home:/dagster_home
      - ../data:/data
      - ../dbt_project:/app/dbt_project
    depends_on:
      - dagster-daemon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dagster-daemon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: climate_dagster_daemon
    <<: *common-env
    command: dagster-daemon run -w /app/orchestration/workspace.yaml
    volumes:
      - dagster_home:/dagster_home
      - ../data:/data
      - ../dbt_project:/app/dbt_project
    restart: unless-stopped

  fastapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: climate_fastapi
    <<: *common-env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  react-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: climate_react
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - fastapi

  prometheus:
    image: prom/prometheus:latest
    container_name: climate_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - fastapi

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: climate_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: climate_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: climate_redis
    ports:
      - "6379:6379"
    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: climate_grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  dagster_home:
    driver: local
