[project]
name = "climate-economic-wellbeing-analysis"
version = "0.1.0"
description = "Cross-impact analysis of climate change on global economic and social wellbeing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Analytics Engineer" }]

dependencies = [
    "requests>=2.32.0",
    "polars>=1.5.0",
    "pandas>=2.2.0",
    "pycountry>=23.12.11",
    "thefuzz>=0.22.1",
    "python-Levenshtein>=0.25.0",
    "duckdb>=1.1.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "statsmodels>=0.14.2",
    "linearmodels>=6.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "dagster>=1.8.0",
    "dagster-dbt>=0.24.0",
    "dagster-duckdb>=0.24.0",
    "dagster-webserver>=1.8.0",
    "streamlit>=1.37.0",
    "plotly>=5.23.0",
    "pydeck>=0.9.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",
    "tqdm>=4.66.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "joblib>=1.4.2",
    "google-genai>=0.2.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "redis>=8.1.0",
    "kafka-python>=3.0.11",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.81.1",
    "qiskit>=2.5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analyses*", "dashboard*", "orchestration*", "tests*"]
exclude = ["data*", "docker*", "dbt_project*", "docs*"]

[tool.uv]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "locust>=2.46.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["analyses/src", "dashboard", "orchestration", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=analyses/src --cov-report=term-missing -v"
