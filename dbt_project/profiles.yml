climate_wellbeing:
  target: dev

  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/climate_wellbeing.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - json
      settings:
        memory_limit: "4GB"
        temp_directory: "/tmp/duckdb_temp"

    ci:
      type: duckdb
      path: ":memory:"
      threads: 2

    prod:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH_PROD', '../data/climate_wellbeing_prod.duckdb') }}"
      threads: 8
