name: Scheduled Data Pipeline Automation

on:
  schedule:
    - cron: '0 0 1 * *' # Run on the first day of every month at midnight UTC
  workflow_dispatch: # Allow manual trigger from the GitHub UI

env:
  PYTHON_VERSION: "3.11"

jobs:
  run-pipeline:
    name: Run End-to-End Data Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Create required directories
        run: mkdir -p data/raw data/external docs analyses/src

      - name: Run Dagster Pipeline
        # This command runs all assets defined in pipeline.py sequentially
        run: uv run dagster asset materialize --select \* -m orchestration.dags.pipeline

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-update pipeline data, notebooks, and images"
          file_pattern: "data/*.duckdb analyses/*.ipynb analyses/*.html docs/*.png"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
