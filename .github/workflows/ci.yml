name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Paralel job'lar için global env
env:
  PYTHON_VERSION: "3.11"
  DBT_PROFILES_DIR: ./dbt_project
  DUCKDB_PATH: ./data/climate_wellbeing_test.duckdb

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Format — ruff
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv pip install --system ruff

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Job 2: Python Unit Tests — pytest
  # ---------------------------------------------------------------------------
  test:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install all dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Create test data dirs
        run: mkdir -p data/raw data/external

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          RANDOM_SEED: 42
          LOG_LEVEL: WARNING

  # ---------------------------------------------------------------------------
  # Job 3: dbt test — staging katmanında veri kalitesi
  # (gerçek ham veri olmadan seed/mock veriyle çalışır)
  # ---------------------------------------------------------------------------
  dbt-test:
    name: dbt Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system dbt-core dbt-duckdb

      - name: dbt deps (paket bağımlılıkları)
        run: dbt deps --project-dir dbt_project --profiles-dir dbt_project

      - name: dbt seed (test verileri)
        run: dbt seed --project-dir dbt_project --profiles-dir dbt_project --target ci

      - name: dbt run
        run: dbt run --project-dir dbt_project --profiles-dir dbt_project --target ci

      - name: dbt test
        run: dbt test --project-dir dbt_project --profiles-dir dbt_project --target ci

      - name: dbt docs generate (lineage check)
        run: dbt docs generate --project-dir dbt_project --profiles-dir dbt_project --target ci

  # ---------------------------------------------------------------------------
  # Job 4: Docker build check (image bozuk mu?)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --file docker/Dockerfile \
            --target runtime \
            --tag climate-wellbeing:ci-${{ github.sha }} \
            .
