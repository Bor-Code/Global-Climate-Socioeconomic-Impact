name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DBT_PROFILES_DIR: ./dbt_project
  DUCKDB_PATH: ./data/climate_wellbeing_test.duckdb

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv pip install --system "ruff==0.5.0"

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install all dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Create test data dirs
        run: mkdir -p data/raw data/external

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          RANDOM_SEED: 42
          LOG_LEVEL: WARNING

  dbt-test:
    name: dbt Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system dbt-core dbt-duckdb

      - name: dbt deps
        run: dbt deps --project-dir dbt_project --profiles-dir dbt_project

      - name: dbt seed
        run: dbt seed --project-dir dbt_project --profiles-dir dbt_project --target ci

      - name: dbt run
        run: dbt run --project-dir dbt_project --profiles-dir dbt_project --target ci

      - name: dbt test
        run: dbt test --project-dir dbt_project --profiles-dir dbt_project --target ci

      - name: dbt docs generate
        run: dbt docs generate --project-dir dbt_project --profiles-dir dbt_project --target ci

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --file docker/Dockerfile \
            --target runtime \
            --tag climate-wellbeing:ci-${{ github.sha }} \
            .
