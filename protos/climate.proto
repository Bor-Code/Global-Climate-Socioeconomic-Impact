syntax = "proto3";

package climate;

service ClimateService {
    rpc PredictHappiness (PredictionRequest) returns (PredictionResponse);
    rpc ChatWithData (ChatRequest) returns (ChatResponse);
}

message PredictionRequest {
    double gdp_per_capita = 1;
    double social_support = 2;
    double life_expectancy = 3;
    double freedom = 4;
    double corruption = 5;
}

message PredictionResponse {
    double predicted_score = 1;
}

message ChatRequest {
    string prompt = 1;
}

message ChatResponse {
    string answer = 1;
    string sql_query = 2;
}
