apiVersion: apps/v1
kind: Deployment
metadata:
  name: climate-frontend
  labels:
    app: climate-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: climate-frontend
  template:
    metadata:
      labels:
        app: climate-frontend
    spec:
      containers:
      - name: climate-frontend
        image: climate-frontend:latest
        ports:
        - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: climate-frontend-svc
spec:
  type: LoadBalancer
  selector:
    app: climate-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5173
